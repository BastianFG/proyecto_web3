    <!-- Navegación instantánea: precarga páginas internas al pasar el cursor (Speculation Rules API) -->
    <script type="speculationrules">
    {
        "prerender": [{
            "where": { "and": [ { "href_matches": "/*" }, { "not": { "selector_matches": "[data-no-prerender]" } } ] },
            "eagerness": "moderate"
        }]
    }
    </script>
